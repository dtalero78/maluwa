<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="2048" viewBox="0 0 2048 2048">
  <defs>
    
    <filter id="paperGrain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"></feTurbulence>
      <feColorMatrix values="0 0 0 0 0.91&#xA;                             0 0 0 0 0.75&#xA;                             0 0 0 0 0.54&#xA;                             0 0 0 0.08 0"></feColorMatrix>
      <feComposite in2="SourceGraphic" operator="in"></feComposite>
    </filter>

    
    <radialGradient id="lightWash" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.9"></stop>
      <stop offset="60%" stop-color="#fdf6e8" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#e9d4a8" stop-opacity="0.25"></stop>
    </radialGradient>

    
    <filter id="warmGrain">
      <feTurbulence type="fractalNoise" baseFrequency="2.2" numOctaves="2" seed="7"></feTurbulence>
      <feColorMatrix values="0 0 0 0 0.89&#xA;                             0 0 0 0 0.71&#xA;                             0 0 0 0 0.46&#xA;                             0 0 0 0.05 0"></feColorMatrix>
    </filter>

    
    <pattern id="diagGrid" x="0" y="0" width="72" height="72" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <line x1="0" y1="0" x2="0" y2="72" stroke="#e9bf8a" stroke-width="1.1" opacity="0.55"></line>
      <line x1="0" y1="0" x2="72" y2="0" stroke="#e9bf8a" stroke-width="1.1" opacity="0.55"></line>
    </pattern>
  </defs>

  
  <rect width="2048" height="2048" fill="#fdf6e8"></rect>

  
  <rect width="2048" height="2048" filter="url(#warmGrain)" opacity="0.6"></rect>

  
  <rect width="2048" height="2048" fill="url(#diagGrid)"></rect>

  
  <rect width="2048" height="2048" fill="url(#lightWash)"></rect>

  
  <rect width="2048" height="2048" filter="url(#paperGrain)" opacity="0.4"></rect>
</svg>