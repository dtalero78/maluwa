<svg xmlns="http://www.w3.org/2000/svg" width="2880" height="1800" viewBox="0 0 2880 1800">
  <defs>
    
    <filter id="paperGrainBig" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"></feTurbulence>
      <feColorMatrix values="0 0 0 0 0.91&#xA;                             0 0 0 0 0.75&#xA;                             0 0 0 0 0.54&#xA;                             0 0 0 0.08 0"></feColorMatrix>
      <feComposite in2="SourceGraphic" operator="in"></feComposite>
    </filter>

    <filter id="warmGrainBig">
      <feTurbulence type="fractalNoise" baseFrequency="2.2" numOctaves="2" seed="7"></feTurbulence>
      <feColorMatrix values="0 0 0 0 0.89&#xA;                             0 0 0 0 0.71&#xA;                             0 0 0 0 0.46&#xA;                             0 0 0 0.05 0"></feColorMatrix>
    </filter>

    
    <pattern id="diagGridBg" x="0" y="0" width="72" height="72" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <line x1="0" y1="0" x2="0" y2="72" stroke="#e9bf8a" stroke-width="1.1" opacity="0.55"></line>
      <line x1="0" y1="0" x2="72" y2="0" stroke="#e9bf8a" stroke-width="1.1" opacity="0.55"></line>
    </pattern>

    
    <radialGradient id="bgLight" cx="30%" cy="20%" r="85%">
      <stop offset="0%" stop-color="#fff8e8" stop-opacity="0.85"></stop>
      <stop offset="55%" stop-color="#fdf6e8" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#c9a370" stop-opacity="0.35"></stop>
    </radialGradient>

    

    
    <radialGradient id="coverPaint" cx="22%" cy="18%" r="95%">
      <stop offset="0%" stop-color="#fadcc4"></stop>
      <stop offset="22%" stop-color="#f6cfb6"></stop>
      <stop offset="55%" stop-color="#edc1c6"></stop>
      <stop offset="100%" stop-color="#d99fae"></stop>
    </radialGradient>

    
    <linearGradient id="coverEdgeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"></stop>
      <stop offset="85%" stop-color="#000" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#8a4f5d" stop-opacity="0.35"></stop>
    </linearGradient>
    <linearGradient id="coverEdgeBottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0"></stop>
      <stop offset="85%" stop-color="#000" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#8a4f5d" stop-opacity="0.3"></stop>
    </linearGradient>

    
    <filter id="coverBrush">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.45" numOctaves="2" seed="5"></feTurbulence>
      <feColorMatrix values="0 0 0 0 0.85&#xA;                             0 0 0 0 0.65&#xA;                             0 0 0 0 0.7&#xA;                             0 0 0 0.07 0"></feColorMatrix>
      <feComposite in2="SourceGraphic" operator="in"></feComposite>
    </filter>

    
    <linearGradient id="paperShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf3e0"></stop>
      <stop offset="100%" stop-color="#f0e4cd"></stop>
    </linearGradient>

    
    <pattern id="pageRules" x="0" y="0" width="100" height="56" patternUnits="userSpaceOnUse">
      <line x1="0" y1="28" x2="100" y2="28" stroke="#d8c39e" stroke-width="1.3" opacity="0.42"></line>
    </pattern>

    
    <linearGradient id="gutterShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.32"></stop>
      <stop offset="100%" stop-color="#000" stop-opacity="0"></stop>
    </linearGradient>
    <linearGradient id="gutterShadeR" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0"></stop>
      <stop offset="100%" stop-color="#000" stop-opacity="0.28"></stop>
    </linearGradient>

    
    <filter id="bookShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur stdDeviation="22"></feGaussianBlur>
    </filter>

    
    <filter id="bookEdge" x="-2%" y="-2%" width="104%" height="104%">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="2"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="4"></feDisplacementMap>
    </filter>

    
    <filter id="paintBar">
      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.6" numOctaves="2" seed="2"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="3.5"></feDisplacementMap>
    </filter>

    
    <filter id="inkWobbleBig" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="2.5"></feDisplacementMap>
    </filter>
  </defs>

  

  
  

  
  <g opacity="0.4" filter="url(#bookShadow)">
    <rect x="270" y="170" width="2380" height="1540" rx="22" ry="22" fill="#6b4a2a"></rect>
  </g>

  <g filter="url(#bookEdge)">
    
    <rect x="240" y="120" width="2400" height="1560" rx="22" ry="22" fill="url(#coverPaint)"></rect>
    
    <rect x="240" y="120" width="2400" height="1560" rx="22" ry="22" filter="url(#coverBrush)" opacity="0.55"></rect>
  </g>

  
  
  <g>
    
    <rect x="260" y="140" width="1180" height="1520" fill="url(#coverPaint)"></rect>
    
    <rect x="260" y="140" width="1180" height="1520" filter="url(#coverBrush)" opacity="0.4"></rect>
    
    <rect x="1240" y="140" width="200" height="1520" fill="url(#gutterShadeR)" opacity="0.6"></rect>
    
    <rect x="260" y="140" width="60" height="1520" fill="url(#coverEdgeBottom)" opacity="0.4" transform="rotate(180,290,900)"></rect>
  </g>

  
  
  <g>
    
    <rect x="1440" y="140" width="1180" height="1520" fill="url(#paperShade)"></rect>
    
    <rect x="1440" y="140" width="1180" height="1520" filter="url(#warmGrainBig)" opacity="0.5"></rect>
    
    <rect x="1440" y="140" width="1180" height="1520" filter="url(#paperGrainBig)" opacity="0.4"></rect>
    
    <rect x="1440" y="140" width="1180" height="1520" fill="url(#bgLight)" opacity="0.5"></rect>
    
    <rect x="1440" y="140" width="160" height="1520" fill="url(#gutterShade)"></rect>
  </g>

  
  <rect x="1430" y="120" width="20" height="1560" fill="#7a4f5d" opacity="0.35"></rect>

  
  
  <g filter="url(#paintBar)">
    
    <rect x="1480" y="1138" width="1100" height="36" rx="6" ry="6" fill="#c25a30" opacity="0.25"></rect>
    
    <rect x="1480" y="1128" width="1100" height="36" rx="6" ry="6" fill="#e57c4a"></rect>
    
    <rect x="1480" y="1130" width="1100" height="6" rx="3" ry="3" fill="#f6cfb6" opacity="0.45"></rect>
    
    <rect x="1980" y="1120" width="120" height="22" rx="4" ry="4" fill="#c25a30"></rect>
  </g>

  
  
  <g>
    
    <rect x="2614" y="855" width="38" height="90" rx="4" ry="4" fill="#5a3a44" opacity="0.35"></rect>
    
    <rect x="2614" y="850" width="38" height="90" rx="4" ry="4" fill="#c98a98"></rect>
    
    <rect x="2618" y="855" width="6" height="80" rx="2" ry="2" fill="#f0c8d0" opacity="0.7"></rect>
    
    <rect x="2640" y="855" width="10" height="80" rx="2" ry="2" fill="#8a4f5d" opacity="0.55"></rect>
  </g>

  
  <g filter="url(#inkWobbleBig)" transform="translate(330,1500)">
    <g stroke="#2a2520" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.78">
      
      <path d="M 12 70 Q 8 42 20 28 Q 32 18 44 28 L 44 50&#xA;               M 44 50 L 44 26 Q 50 14 60 18 Q 66 24 64 38 L 64 56&#xA;               M 64 56 L 64 38 Q 70 30 78 36 Q 82 44 80 56 L 80 66&#xA;               M 80 66 L 80 56 Q 86 52 90 58 Q 90 66 88 74&#xA;               L 86 96 Q 82 112 66 118 Q 46 122 30 114 Q 16 104 12 84 Z"></path>
      <path d="M 18 108 Q 38 118 70 116" stroke-width="2.5"></path>
    </g>
  </g>

</svg>